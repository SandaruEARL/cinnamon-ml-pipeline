name: Weekly Model Training Pipeline

on:
  schedule:
    - cron: '30 12 * * 3'  # Every Wednesday 6:00 PM Sri Lanka time (UTC+5:30)
    
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write  # Allow commits

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # ========================================
    # SETUP
    # ========================================
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    # ========================================
    # SCRAPE & UPDATE DATA
    # ========================================
    - name: Scrape Latest Data (Last 4 Weeks)
      run: |
        if [ -f "data/cinnamon_grades.csv" ]; then
           echo " Current dataset: $(wc -l < data/cinnamon_grades.csv) lines"
        fi
    
        cd scripts
        python incremental_scraper.py
        cd ..
    
        if [ -f "scripts/cinnamon_grades_updated.csv" ]; then
          mv scripts/cinnamon_grades_updated.csv data/cinnamon_grades.csv
          echo "✓ Data merged and updated"
          echo " Updated dataset: $(wc -l < data/cinnamon_grades.csv) lines"
        else
          echo "⚠ No new data scraped"
        fi
    
    - name: Commit Updated Dataset
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add data/cinnamon_grades.csv
        
        if git diff --staged --quiet; then
          echo "No data changes"
        else
          git commit -m " Update dataset - $(date +'%Y-%m-%d')"
        fi
    
    # ========================================
    # TRAIN MODEL
    # ========================================
    - name: Train LSTM Model
      run: |
        python scripts/train_model.py
        
        if [ ! -f "models/cinnamon_grades_model.h5" ]; then
          echo "❌ Training failed"
          exit 1
        fi
        
        echo "✓ Training complete"
    
    # ========================================
    # CONVERT TO TFLITE
    # ========================================
    - name: Convert to TFLite
      run: |
        python scripts/convert_to_tflite.py
        
        if [ ! -f "cinnamon_grades_model.tflite" ]; then
          echo "❌ Conversion failed"
          exit 1
        fi
        
        # Use consistent naming: latest.tflite
        mv cinnamon_grades_model.tflite models/latest.tflite
        echo "✓ Conversion complete"
    
    # ========================================
    # EXPORT FOR FLUTTER
    # ========================================
    - name: Export Preprocessing for Flutter
      run: |
        python scripts/export_preprocessing_to_json.py
        
        if [ ! -f "models/preprocessing.json" ] || [ ! -f "models/recent_data.csv" ]; then
          echo "❌ Export failed"
          exit 1
        fi
        
        echo "✓ Export complete"
    
    # ========================================
    # ARCHIVE IN PRIVATE REPO
    # ========================================
    - name: Archive Model in Private Repo
      run: |
        VERSION=$(date -u +%Y%m%d_%H%M%S)
        mkdir -p models/archived
        cp models/latest.tflite models/archived/model_v${VERSION}.tflite
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "✓ Archived: model_v${VERSION}.tflite"
      id: archive
    
    - name: Commit to Private Repo
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git pull origin main
        git add models/
        
        VERSION=${{ steps.archive.outputs.version }}
        git commit -m " Archive model v${VERSION} - $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
        git push origin main
        
        echo "✓ Private repo updated!"
    
    # ========================================
    # DEPLOY TO PUBLIC REPO
    # ========================================
    - name: Deploy to Public Model Repository
      env:
        PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      run: |
        echo "📥 Cloning public repository..."
        git clone https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/SandaruEARL/cinnamon-models.git public-repo
        
        cd public-repo
        mkdir -p models
        
        # Copy ALL required files
        echo "📋 Copying model files..."
        cp ../models/latest.tflite models/latest.tflite
        cp ../models/preprocessing.json models/preprocessing.json
        cp ../models/recent_data.csv models/recent_data.csv
        
        # Calculate hash and metadata from the actual file
        MODEL_HASH=$(sha256sum models/latest.tflite | awk '{print $1}')
        MODEL_SIZE=$(stat -c%s models/latest.tflite)
        MODEL_SIZE_KB=$(echo "scale=2; $MODEL_SIZE / 1024" | bc)
        VERSION=${{ steps.archive.outputs.version }}
        
        # Get records count if available
        RECORDS=0
        if [ -f "../data/cinnamon_grades.csv" ]; then
          RECORDS=$(tail -n +2 ../data/cinnamon_grades.csv | wc -l)
        fi
        
        # Create version.json with correct hash
        cat > models/version.json << EOF
        {
          "version": "$VERSION",
          "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "model_hash": "$MODEL_HASH",
          "model_size_bytes": $MODEL_SIZE,
          "model_size_kb": $MODEL_SIZE_KB,
          "records_count": $RECORDS
        }
        EOF
        
        echo "✅ Generated version.json"
        echo "   Hash: $MODEL_HASH"
        echo "   Size: $MODEL_SIZE_KB KB"
        cat models/version.json
        
        # Configure git
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Commit and push
        git add models/
        
        if git diff --staged --quiet; then
          echo "⚠️  No changes to deploy"
        else
          git commit -m "Deploy model v${VERSION} - $(date +'%Y-%m-%d %H:%M UTC')"
          git push origin main
          
          echo "✅ Deployment complete!"
        fi
        
        cd ..
    
    # ========================================
    # CREATE GITHUB RELEASE
    # ========================================
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      run: |
        VERSION=${{ steps.archive.outputs.version }}
        RELEASE_TAG="v${VERSION}"
        
        cd public-repo
        
        # Only create release if there were changes
        if git diff HEAD~1 HEAD --quiet models/latest.tflite 2>/dev/null; then
          echo "⚠️ No model changes, skipping release"
        else
          gh release create "$RELEASE_TAG" \
            models/latest.tflite \
            models/preprocessing.json \
            models/recent_data.csv \
            --title "Model ${VERSION}" \
            --notes "Model trained on $(date -u +"%Y-%m-%d")" \
            --repo SandaruEARL/cinnamon-models \
            || echo "Release already exists"
        fi
        
        cd ..
    
    # ========================================
    # VERIFY CDN PROPAGATION
    # ========================================
    - name: Purge jsdelivr CDN Cache
      uses: gacts/purge-jsdelivr-cache@v1
      with:
        url: |
          https://cdn.jsdelivr.net/gh/SandaruEARL/cinnamon-models@main/models/version.json
          https://cdn.jsdelivr.net/gh/SandaruEARL/cinnamon-models@main/models/latest.tflite
          https://cdn.jsdelivr.net/gh/SandaruEARL/cinnamon-models@main/models/preprocessing.json
          https://cdn.jsdelivr.net/gh/SandaruEARL/cinnamon-models@main/models/recent_data.csv
    
    - name: Verify Deployment
      run: |
        VERSION=${{ steps.archive.outputs.version }}
        
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ DEPLOYMENT SUCCESSFUL!"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "📦 Model Version: ${VERSION}"
        echo ""
        echo "🔗 CDN URLs (Primary):"
        echo "https://cdn.jsdelivr.net/gh/SandaruEARL/cinnamon-models@main/models/latest.tflite"
        echo "https://cdn.jsdelivr.net/gh/SandaruEARL/cinnamon-models@main/models/version.json"
        echo "https://cdn.jsdelivr.net/gh/SandaruEARL/cinnamon-models@main/models/preprocessing.json"
        echo "https://cdn.jsdelivr.net/gh/SandaruEARL/cinnamon-models@main/models/recent_data.csv"
        echo ""
        echo "🔗 GitHub Raw (Fallback):"
        echo "https://raw.githubusercontent.com/SandaruEARL/cinnamon-models/main/models/latest.tflite"
        echo "https://raw.githubusercontent.com/SandaruEARL/cinnamon-models/main/models/version.json"
        echo "https://raw.githubusercontent.com/SandaruEARL/cinnamon-models/main/models/preprocessing.json"
        echo "https://raw.githubusercontent.com/SandaruEARL/cinnamon-models/main/models/recent_data.csv"
        echo ""
        echo "✅ CDN cache purged"
        echo "⏳ Allow 30-60 seconds for global propagation..."
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        # Wait for CDN propagation
        sleep 60
        
        # Verify version.json is accessible
        echo ""
        echo "🔍 Testing CDN access..."
        CACHE_BUSTER=$(date +%s)
        if curl -f -s "https://cdn.jsdelivr.net/gh/SandaruEARL/cinnamon-models@main/models/version.json?_=$CACHE_BUSTER" > /dev/null; then
          echo "✅ version.json accessible via CDN"
          
          # Verify it's the correct version
          REMOTE_VERSION=$(curl -s "https://cdn.jsdelivr.net/gh/SandaruEARL/cinnamon-models@main/models/version.json?_=$CACHE_BUSTER" | jq -r '.version')
          if [ "$REMOTE_VERSION" == "$VERSION" ]; then
            echo "✅ CDN serving correct version: $REMOTE_VERSION"
          else
            echo "⚠️  CDN version mismatch: $REMOTE_VERSION (expected $VERSION)"
            echo "   This is normal, CDN will update within 2-3 minutes"
          fi
        else
          echo "⚠️  CDN not ready yet (this is normal)"
        fi
