name: Weekly ML Training Pipeline

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday 00:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write  # Allow commits

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # ========================================
    # SETUP
    # ========================================
    - name: 📥 Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: 📦 Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    # ========================================
    # SCRAPE & UPDATE DATA
    # ========================================
    - name: 🕷️ Scrape Latest Data (Last 4 Weeks)
      run: |
        # Show existing data info
        if [ -f "data/cinnamon_grades.csv" ]; then
           echo "📊 Current dataset: $(wc -l < data/cinnamon_grades.csv) lines"
        fi
    
        cd scripts
        python incremental_scraper.py
        cd ..
    
        # Move updated CSV if exists
        if [ -f "scripts/cinnamon_grades_updated.csv" ]; then
          mv scripts/cinnamon_grades_updated.csv data/cinnamon_grades.csv
          echo "✓ Data merged and updated"
          echo "📊 Updated dataset: $(wc -l < data/cinnamon_grades.csv) lines"
        else
          echo "⚠ No new data scraped"
        fi
    
    - name: 💾 Commit Updated Dataset
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add data/cinnamon_grades.csv
        
        if git diff --staged --quiet; then
          echo "No data changes"
        else
          git commit -m "📊 Update dataset - $(date +'%Y-%m-%d')"
        fi
    
    # ========================================
    # TRAIN MODEL
    # ========================================
    - name: 🧠 Train LSTM Model
      run: |
        python scripts/train_model.py
        
        if [ ! -f "models/cinnamon_grades_model.h5" ]; then
          echo "❌ Training failed"
          exit 1
        fi
        
        echo "✓ Training complete"
    
    # ========================================
    # CONVERT TO TFLITE
    # ========================================
    - name: 📱 Convert to TFLite
      run: |
        python scripts/convert_to_tflite.py
        
        if [ ! -f "cinnamon_grades_model.tflite" ]; then
          echo "❌ Conversion failed"
          exit 1
        fi
        
        mv cinnamon_grades_model.tflite models/latest.tflite
        echo "✓ Conversion complete"
    
    # ========================================
    # GENERATE VERSION INFO
    # ========================================
    - name: 📋 Generate Version Info
      id: version
      run: |
        python scripts/generate_version.py
        
        # Export variables for later steps
        VERSION=$(jq -r '.version' models/version.json)
        RECORDS=$(jq -r '.records_count' models/version.json)
        SIZE=$(jq -r '.model_size_kb' models/version.json)
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "records=$RECORDS" >> $GITHUB_OUTPUT
        echo "size=$SIZE" >> $GITHUB_OUTPUT
        
        cat models/version.json
    
    # ========================================
    # ARCHIVE IN PRIVATE REPO
    # ========================================
    - name: 📦 Archive Model in Private Repo
      run: |
        VERSION=$(jq -r '.version' models/version.json)
        mkdir -p models/archived
        cp models/latest.tflite models/archived/model_v${VERSION}.tflite
        echo "✓ Archived: model_v${VERSION}.tflite"
    
    - name: 💾 Commit to Private Repo
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add models/
        
        VERSION=$(jq -r '.version' models/version.json)
        git commit -m "🤖 Archive model v${VERSION} - $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
        
        git push origin main
        
        echo "✓ Private repo updated!"
    
    # ========================================
    # DEPLOY TO PUBLIC REPO
    # ========================================
    - name: 🚀 Deploy to Public Model Repository
      env:
        PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      run: |
        # IMPORTANT: Replace YOUR_USERNAME and YOUR_PUBLIC_REPO with your actual values
        # Example: git clone https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/johndoe/cinnamon-models-public.git
        
        echo "📥 Cloning public repository..."
        git clone https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/SandaruEARL/cinnamon-models.git public-repo
        
        cd public-repo
        
        # Create models directory
        mkdir -p models
        
        # Copy model and version info
        echo "📋 Copying model files..."
        cp ../models/latest.tflite models/
        cp ../models/version.json models/